<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - Chuka SRMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1e293b; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .card-box { width: 100%; max-width: 400px; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); background: white; }
    </style>
</head>
<body>
<div class="card-box">
    <h3 class="text-center fw-bold mb-4" style="color: #1e293b;">Reset Password</h3>
    <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success text-center" th:text="${success}"></div>
    <p class="text-muted text-center mb-4">Enter your registered email address. We will send you a link to reset your password.</p>
    <form action="/forgot-password" method="post">
        <div class="mb-4">
            <label class="form-label fw-bold">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="admin@example.com" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
        <a href="/login" class="btn btn-link w-100 mt-2">Back to Login</a>
    </form>
</div>
</body>
</html>
