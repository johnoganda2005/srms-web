<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Password - Chuka SRMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1e293b; height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; }
        .card-box { width: 100%; max-width: 400px; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); background: white; }
    </style>
</head>
<body>
<div class="card-box">
    <h3 class="text-center fw-bold mb-4" style="color: #1e293b;">Set New Password</h3>
    <div th:if="${error}" class="alert alert-danger text-center" th:text="${error}"></div>
    <form action="/reset-password" method="post">
        <input type="hidden" name="token" th:value="${token}">
        <div class="mb-4">
            <label class="form-label fw-bold">New Password</label>
            <input type="password" name="newPassword" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-success w-100">Update Password</button>
    </form>
</div>
</body>
</html>
