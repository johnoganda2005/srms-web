<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Chuka University SRMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #1e293b; /* Matches your sidebar */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            background: white;
        }
        .login-icon {
            font-size: 50px;
            color: #38bdf8;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Fix for Chrome autofill background color */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px white inset !important;
            -webkit-text-fill-color: #212529 !important;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-icon">
        <i class="fas fa-university"></i>
    </div>
    <h3 class="text-center mb-4 fw-bold" style="color: #1e293b;">Chuka SRMS</h3>

    <!-- Error Message -->
    <div th:if="${param.error}" class="alert alert-danger text-center py-2">
        <i class="fas fa-exclamation-triangle"></i> Invalid username or password.
    </div>

    <!-- Logout Message -->
    <div th:if="${param.logout}" class="alert alert-success text-center py-2">
        <i class="fas fa-check-circle"></i> You have been logged out.
    </div>

    <!-- Success Message (For Password Reset) -->
    <div th:if="${success}" class="alert alert-success text-center py-2" th:text="${success}"></div>

    <!-- Login Form -->
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label text-muted fw-bold">Username</label>
            <input type="text" name="username" class="form-control form-control-lg" placeholder="Enter username" required autofocus>
        </div>
        <div class="mb-4">
            <label class="form-label text-muted fw-bold">Password</label>
            <input type="password" name="password" class="form-control form-control-lg" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-success btn-lg w-100 fw-bold">
            Sign In <i class="fas fa-arrow-right ms-2"></i>
        </button>
    </form>

    <!-- Forgot Password Link -->
    <div class="text-center mt-4">
        <a href="/forgot-password" class="text-decoration-none fw-bold" style="color: #38bdf8;">
            <i class="fas fa-key"></i> Forgot Password?
        </a>
    </div>
</div>

</body>
</html>
